<div class="flex-container">
  <img src='images/Rectangle_77.png' alt="Image" class="image"/>
  <!-- <div class="login-right"> -->
    <!-- <b>Your Logo</b> -->
    <div class="login-box">
      <p>Welcome to Pomfights!</p>
      <div class = "login-button">
        <button type="button" class="login-button-active">Login</button>
        <a routerLink="/user" routerLinkActive="active" class="login-button-unactive">Register</a>
      </div>
      <div class="login-input">
        <label for="username" class="login-label">Username</label>
        <input type="text" id="username" class="input" placeholder="Enter your Username">
        <label for="password" class="login-label">Password</label>
        <input type="password" id="password" class="input" placeholder="Enter your Password">
        <div>
        <input type="checkbox" id="remember" class="remember-input">
        <label for="remember" class="remember-label">Remember me</label>
        </div>
        <div class="submit-div">
          <button type="button" class="login-button-active">Login</button>
        </div>
      </div>
    </div>
  <!-- </div> -->
</div>
